<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voltbridge</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { color-scheme: light dark; --bg: #f4f6f8; --card: #fff; --fg: #1b1f24; --mute: #5b6470; --line: #d8dde3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1214; --card: #181c20; --fg: #e7eaee; --mute: #98a1ad; --line: #2c333a; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center; }
  main { width: 100%; max-width: 24rem; box-sizing: border-box; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 2rem 1.5rem 1.5rem; text-align: center; box-shadow: 0 4px 24px rgba(0, 0, 0, .06); }
  .logo { width: 56px; height: 56px; }
  h1 { font-size: 1.5rem; margin: .75rem 0 .25rem; }
  p { margin: .5rem 0; }
  .mute { color: var(--mute); }
  .small { font-size: .85rem; }
  .google { display: flex; align-items: center; justify-content: center; gap: .75rem; width: 100%; box-sizing: border-box; margin: 1.5rem 0 1rem; padding: .65rem 1rem; border: 1px solid #dadce0; border-radius: 8px; background: #fff; color: #3c4043; font-weight: 500; text-decoration: none; }
  .google:hover { background: #f8f9fa; box-shadow: 0 1px 3px rgba(60, 64, 67, .3); }
  .google svg { width: 20px; height: 20px; }
  footer { margin-top: 1rem; text-align: center; font-size: .85rem; color: var(--mute); }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <div class="card">
    <img class="logo" src="/favicon.svg" alt="">
    <h1>Voltbridge</h1>
    <p class="mute">Sketch electrical schematics by talking to an AI assistant.</p>
    <a class="google" href="/auth/google">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </a>
    <p class="mute small">Each account has a small monthly allowance. Drawings can contain mistakes: never build from one without review by a qualified electrician.</p>
  </div>
  <footer><a href="/privacy">Privacy policy</a> · <a href="/terms">Terms of service</a></footer>
</main>
</body>
</html>
